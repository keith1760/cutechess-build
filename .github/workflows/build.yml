name: build cutechess
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "${{ matrix.os }} Qt ${{ matrix.qt_version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-2022
            qt_version: 6.8.3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: install qt 6.x
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ matrix.qt_version }}

      - name: build cute chess
        shell: cmd
        run: |
          call "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat"
          cmake -S . -B build
          cmake --build build --config release

      - name: run unit tests
        shell: cmd
        run: |
          call "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat"
          ctest --test-dir build

      - name: stage a clean, self-contained output folder
        shell: cmd
        run: |
          mkdir dist
          copy build\Release\cutechess.exe dist\CutechessWindowsLargeBoard.exe
          copy build\Release\cutechess-cli.exe dist\cutechess-cli.exe
          copy COPYING dist\COPYING.txt
          copy docs\cutechess-cli.6.html dist\ 2>nul & exit /b 0
          copy docs\cutechess-engines.json.5.html dist\ 2>nul & exit /b 0

      - name: deploy qt runtime + msvc compiler runtime dependencies
        shell: cmd
        run: |
          windeployqt --release --no-translations --compiler-runtime dist\CutechessWindowsLargeBoard.exe
          windeployqt --release --no-translations --compiler-runtime dist\cutechess-cli.exe

      - name: upload windows executable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CutechessWindowsLargeBoard
          path: dist/
          if-no-files-found: error
