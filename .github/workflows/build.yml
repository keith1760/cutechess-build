name: build cutechess
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "${{ matrix.os }} Qt ${{ matrix.qt_version }}"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows-2022
            qt_version: 6.8.3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: install qt 6.x
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ matrix.qt_version }}

      - name: build cute chess
        shell: cmd
        run: |
          call "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat"
          cmake -S . -B build
          cmake --build build --config release

      - name: run unit tests
        shell: cmd
        run: |
          call "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat"
          ctest --test-dir build

      - name: stage a clean, self-contained output folder
        shell: cmd
        run: |
          mkdir FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE
          copy build\Release\cutechess.exe FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE\cutechess.exe
          copy build\Release\cutechess-cli.exe FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE\cutechess-cli.exe
          copy COPYING FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE\COPYING.txt
          if exist docs\cutechess-cli.6.html copy docs\cutechess-cli.6.html FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE\
          if exist docs\cutechess-engines.json.5.html copy docs\cutechess-engines.json.5.html FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE\

      - name: deploy qt runtime + msvc compiler runtime dependencies
        shell: cmd
        run: |
          call "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat"
          windeployqt --release --no-translations --no-compiler-runtime FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE\cutechess.exe
          windeployqt --release --no-translations --no-compiler-runtime FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE\cutechess-cli.exe
          rem windeployqt's --compiler-runtime only drops in the vc_redist.x64.exe
          rem *installer*, not something a "just unzip and run" portable folder
          rem can use. Copy the actual redistributable runtime DLLs (vcruntime140.dll,
          rem msvcp140.dll, etc.) straight from the VS toolchain's own redist folder
          rem instead -- this is Microsoft's documented, license-compliant way to
          rem privately redistribute those DLLs alongside an application.
          copy "%VCToolsRedistDir%x64\Microsoft.VC143.CRT\*.dll" FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE\

      - name: verify msvc runtime dlls were bundled
        shell: cmd
        run: |
          if not exist FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE\vcruntime140.dll (echo ERROR: vcruntime140.dll missing && exit /b 1)
          if not exist FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE\msvcp140.dll (echo ERROR: msvcp140.dll missing && exit /b 1)
          echo MSVC runtime DLLs confirmed present.

      - name: add a copy of the source code alongside the build
        shell: bash
        run: |
          mkdir -p FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE/source
          git archive HEAD | tar -x -C FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE/source

      - name: upload windows executable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE
          path: FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE/
          if-no-files-found: error

      - name: zip the self-contained folder
        shell: pwsh
        run: Compress-Archive -Path FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE -DestinationPath FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE.zip

      - name: publish zip as a github release asset
        shell: bash
        run: |
          TAG="winbuild-${GITHUB_RUN_ID}"
          gh release create "$TAG" \
            --title "Windows build ${GITHUB_RUN_ID}" \
            --notes "Automated self-contained Windows build of commit ${GITHUB_SHA}." \
            FINALFINALCUTECHESSWINDOWSDIFFERENTSOURCE.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
