name: build cutechess
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "windows-2022 Qt 6.8.3"
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: install qt 6.x
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 6.8.3

      - name: build cute chess
        shell: cmd
        run: |
          call "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat"
          cmake -S . -B build -DWITH_TESTS=OFF > build.log 2>&1
          if errorlevel 1 exit /b 1
          cmake --build build --config release >> build.log 2>&1
          exit /b %ERRORLEVEL%

      - name: report build errors
        if: failure()
        shell: bash
        run: |
          grep -E "error|Error|FAILED" build.log | head -25 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error title=build errors::/' || true

      - name: stage a clean, self-contained output folder
        shell: cmd
        run: |
          mkdir winpkg
          copy build\Release\cutechess.exe winpkg\CutechessWeightOfTextTickBoxFix22-10-26.exe
          copy build\Release\cutechess-cli.exe winpkg\cutechess-cli.exe
          copy COPYING winpkg\COPYING.txt

      - name: deploy qt runtime + msvc compiler runtime dependencies
        shell: cmd
        run: |
          call "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat"
          windeployqt --release --no-translations --no-compiler-runtime winpkg\CutechessWeightOfTextTickBoxFix22-10-26.exe
          windeployqt --release --no-translations --no-compiler-runtime winpkg\cutechess-cli.exe
          copy "%VCToolsRedistDir%x64\Microsoft.VC143.CRT\*.dll" winpkg\

      - name: upload windows executable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CutechessWeightOfTextTickBoxFix22-10-26
          path: winpkg/
          if-no-files-found: error

      - name: publish the build as a release
        shell: bash
        run: |
          cd winpkg && 7z a -tzip ../CutechessWeightOfTextTickBoxFix22-10-26-win64.zip . > /dev/null && cd ..
          gh release create "winrelease-${{ github.run_id }}" \
            --title "CutechessWeightOfTextTickBoxFix22-10-26 (${{ github.run_id }})" \
            --notes "Windows build of CutechessWeightOfTextTickBoxFix22-10-26.exe" \
            CutechessWeightOfTextTickBoxFix22-10-26-win64.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
