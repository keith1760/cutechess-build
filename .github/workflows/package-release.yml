name: package windows build as release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id that produced the CutechessWindowsLargeBoard artifact"
        required: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/package-release.yml"

permissions: {}

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: download built windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: CutechessWindowsLargeBoard
          path: winbuild
          run-id: ${{ inputs.run_id || '33244940951' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: zip windows build
        run: |
          cd winbuild
          zip -r ../CutechessWindowsLargeBoard-win64.zip .
          cd ..

      - name: zip source code
        run: |
          git archive --format=zip -o CutechessWindowsLargeBoard-source.zip HEAD

      - name: create release
        run: |
          TAG="winrelease-${{ github.run_id }}"
          gh release create "$TAG" \
            --title "CutechessWindowsLargeBoard (${{ github.run_id }})" \
            --notes "Windows build of CutechessWindowsLargeBoard.exe with bundled Qt6 runtime, plus matching source code." \
            CutechessWindowsLargeBoard-win64.zip \
            CutechessWindowsLargeBoard-source.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
