name: package windows build as release
on:
  workflow_run:
    workflows: ["build cutechess"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id that produced the CutechessWindowsEvalBarFix artifact (only needed for manual re-runs)"
        required: false

permissions: {}

env:
  PACKAGE_NAME: "Cutechess fork -Final7-9-26"
  RYZENADJ_VERSION: "v0.19.0"
  RYZENADJ_SRC_SHA256: "3dacdfe346e6d6f21ef9987346d722d9dc5e2e16523a0a5e1a1beac6dfb3f685"

jobs:
  package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: download built windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: CutechessWindowsEvalBarFix
          path: winbuild
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: assemble the self-contained package folder
        run: |
          mkdir -p "$PACKAGE_NAME"
          cp -r winbuild/. "$PACKAGE_NAME/"
          ls -la "$PACKAGE_NAME"
          test -f "$PACKAGE_NAME/RyzenAdj/ryzenadj.exe" || (echo "ERROR: RyzenAdj.exe missing from package" && exit 1)

      - name: zip the self-contained windows package
        run: |
          zip -r "${PACKAGE_NAME}.zip" "$PACKAGE_NAME"

      - name: zip a standalone copy of the cutechess fork source code
        run: |
          git archive --format=zip --prefix="CutechessFork-source/" -o CutechessFork-source.zip HEAD

      - name: download, verify and zip a standalone copy of the RyzenAdj source code
        run: |
          curl -fsSL -o ryzenadj-source-raw.zip "https://github.com/FlyGoat/RyzenAdj/archive/refs/tags/${RYZENADJ_VERSION}.zip"
          echo "${RYZENADJ_SRC_SHA256}  ryzenadj-source-raw.zip" | sha256sum --check --status
          mv ryzenadj-source-raw.zip RyzenAdj-source.zip

      - name: create release
        run: |
          TAG="winrelease-${{ github.run_id }}"
          gh release create "$TAG" \
            --title "${PACKAGE_NAME} (${{ github.run_id }})" \
            --notes "Self-contained Windows package (Cutechess fork + bundled Qt6/MSVC runtime + RyzenAdj ${RYZENADJ_VERSION}), plus standalone source-code archives for the Cutechess fork and for RyzenAdj." \
            "${PACKAGE_NAME}.zip" \
            CutechessFork-source.zip \
            RyzenAdj-source.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
