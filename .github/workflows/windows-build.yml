name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure (CMake)
        shell: cmd
        continue-on-error: true
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=OFF > configure.log 2>&1
          echo CONFIGURE_EXIT=%ERRORLEVEL% >> configure.log

      - name: Build (Release)
        shell: cmd
        continue-on-error: true
        run: |
          cmake --build build > buildlog.log 2>&1
          echo BUILD_EXIT=%ERRORLEVEL% >> buildlog.log

      - name: Package with windeployqt
        shell: cmd
        continue-on-error: true
        run: |
          mkdir dist\CutechessWindows > package.log 2>&1
          copy build\cutechess.exe dist\CutechessWindows\WindowsCutechesswithBlackMenuFix.exe >> package.log 2>&1
          if exist build\cutechess-cli.exe copy build\cutechess-cli.exe dist\CutechessWindows\cutechess-cli.exe >> package.log 2>&1
          windeployqt --release dist\CutechessWindows\WindowsCutechesswithBlackMenuFix.exe >> package.log 2>&1
          echo PACKAGE_EXIT=%ERRORLEVEL% >> package.log
          dir build >> package.log 2>&1

      - name: Zip artifact
        shell: pwsh
        continue-on-error: true
        run: |
          Compress-Archive -Path dist\CutechessWindows\* -DestinationPath WindowsCutechesswithBlackMenuFix.zip

      - name: Publish logs to repo (always)
        if: always()
        shell: bash
        run: |
          set -x
          git config user.email "ci@example.com"
          git config user.name "CI Bot"
          git checkout --orphan ci-logs-tmp
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p logs
          for f in configure.log buildlog.log package.log; do
            if [ -f "$f" ]; then cp "$f" "logs/$f"; fi
          done
          echo "run_id=${{ github.run_id }}" > logs/meta.txt
          git add logs
          git commit -m "CI logs for run ${{ github.run_id }}" || true
          git push --force origin ci-logs-tmp:ci-logs

      - name: Create release and upload binary
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "build-$($env:GITHUB_RUN_ID)"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $body = @{ tag_name = $tag; name = $tag; body = "Automated Windows build $tag"; draft = $false; prerelease = $true } | ConvertTo-Json
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/keith1760/cutechess-build/releases" -Method Post -Headers $headers -Body $body -ContentType "application/json"
          Write-Host "Created release: $($release.html_url)"
          $uploadUrl = ($release.upload_url -replace '\{\?name,label\}','')
          if (Test-Path WindowsCutechesswithBlackMenuFix.zip) {
            curl.exe -s -w "HTTP_STATUS:%{http_code}`n" -X POST -H "Authorization: Bearer $env:GH_TOKEN" -H "Content-Type: application/zip" --data-binary "@WindowsCutechesswithBlackMenuFix.zip" "$($uploadUrl)?name=WindowsCutechesswithBlackMenuFix.zip"
          } else {
            Write-Host "No WindowsCutechesswithBlackMenuFix.zip found to upload"
          }
