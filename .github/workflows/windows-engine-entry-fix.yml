name: Windows build - CutechessWindowswithEngineEntryFix

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'projects/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-engine-entry-fix.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'

      - name: Configure (CMake)
        shell: cmd
        run: |
          call "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat"
          cmake -S . -B build -DWITH_TESTS=OFF

      - name: Build (Release)
        shell: cmd
        run: |
          call "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat"
          cmake --build build --config Release

      - name: Package with windeployqt
        shell: cmd
        run: |
          mkdir dist\CutechessWindowswithEngineEntryFix
          copy build\Release\cutechess.exe dist\CutechessWindowswithEngineEntryFix\CutechessWindowswithEngineEntryFix.exe
          if exist build\Release\cutechess-cli.exe copy build\Release\cutechess-cli.exe dist\CutechessWindowswithEngineEntryFix\cutechess-cli.exe
          windeployqt --release dist\CutechessWindowswithEngineEntryFix\CutechessWindowswithEngineEntryFix.exe

      - name: Zip artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist\CutechessWindowswithEngineEntryFix\* -DestinationPath CutechessWindowswithEngineEntryFix.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CutechessWindowswithEngineEntryFix
          path: CutechessWindowswithEngineEntryFix.zip

      - name: Create release and upload binary
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "engine-entry-fix-$($env:GITHUB_RUN_ID)"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $body = @{ tag_name = $tag; name = $tag; body = "Automated Windows build $tag"; draft = $false; prerelease = $true } | ConvertTo-Json
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases" -Method Post -Headers $headers -Body $body -ContentType "application/json"
          Write-Host "Created release: $($release.html_url)"
          $uploadUrl = ($release.upload_url -replace '\{\?name,label\}','')
          curl.exe -s -w "HTTP_STATUS:%{http_code}`n" -X POST -H "Authorization: Bearer $env:GH_TOKEN" -H "Content-Type: application/zip" --data-binary "@CutechessWindowswithEngineEntryFix.zip" "$($uploadUrl)?name=CutechessWindowswithEngineEntryFix.zip"
